{% extends "base.html" %}
{% block title %}Jobs{% endblock %}
{% block content %}
<section class="panel">
  <h1>Jobs</h1>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>ID</th><th>Type</th><th>Status</th><th>Message</th><th>Updated</th></tr>
      </thead>
      <tbody>
        {% for job in jobs %}
        <tr>
          <td><a href="{{ bp }}/jobs/{{ job.id }}">#{{ job.id }}</a></td>
          <td>{{ job.job_type }}</td>
          <td><span class="badge {% if job.status == 'completed' %}ok{% elif job.status == 'failed' %}fail{% elif job.status == 'running' %}run{% endif %}">{{ job.status }}</span></td>
          <td>{{ job.message }}</td>
          <td>{{ job.updated_at }}</td>
        </tr>
        {% else %}
        <tr><td colspan="5">No jobs</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
